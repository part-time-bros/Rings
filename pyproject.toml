[project]
name = "india-signals"
version = "0.1.0"
description = "Live NSE/BSE buy/sell signals for intraday and long-term trading"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "tradingview-ta>=3.3.0",
    "tradingview-screener>=3.0.0",
]

[project.scripts]
india-signals = "india_signals.cli:main"
india-signals-mcp = "india_signals.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/india_signals"]
